services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: sql-server
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LearnJava@Password@2026"
    volumes:
      - mssql_data:/var/opt/mssql

volumes:
  mssql_data: